# Fixture: release workflow that triggers from an ordinary branch push.
# Known-bad input for the workflow contract parser (Wave 1, Agent 1C).

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" --title "TokenMaxxer"
