# Fixture: release workflow satisfying every PR-10 release contract.
# Known-good input for the workflow contract parser (Wave 1, Agent 1C).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Release preflight (identity + immutable releases fail-closed)
        run: npm run release-preflight

      - name: Run full release gate
        run: npm test

      - name: Create draft release for existing tag
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TokenMaxxer $GITHUB_REF_NAME"

      - name: Upload complete staged asset set
        run: gh release upload "$GITHUB_REF_NAME" .release/tokenmaxxer.js .release/tokenmaxxer-tui.js .release/tokenmaxxer-cli.js .release/tokenmaxxer .release/install.sh .release/RELEASE.json .release/tokenmaxxer-*.tgz .release/SHA256SUMS

      - name: Verify uploaded asset names and checksums
        run: |
          gh release verify "$GITHUB_REF_NAME"
          gh release verify-asset "$GITHUB_REF_NAME" .release/SHA256SUMS
          (cd .release && sha256sum -c SHA256SUMS)

      - name: Publish draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify published release
        run: gh release verify "$GITHUB_REF_NAME"
