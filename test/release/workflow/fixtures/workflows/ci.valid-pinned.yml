# Fixture: CI workflow that satisfies every PR-10 workflow contract.
# Known-good input for the workflow contract parser (Wave 1, Agent 1C).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Clean install
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Verify host contract
        run: npm run verify:host-contract

      - name: Audit release gate
        run: npm run audit:release

      - name: Build distribution
        run: npm run build

      - name: Verify exact dist inventory
        run: npm run verify:dist

      - name: Verify self-contained bundles (no generated chunk imports)
        run: |
          test -s dist/index.js
          test -s dist/tui.js
          test -s dist/cli.js
          ! grep -qE '(from|import\()\s*["'"']\.\.?/' dist/index.js dist/tui.js dist/cli.js

      - name: Check TUI bundle
        run: npm run check:tui-bundle

      - name: Verify CLI bundle and launcher
        run: npm run verify-cli-bundle

      - name: Post-build CLI smoke
        run: npm run smoke:cli

      - name: Validate installer and launcher syntax
        run: |
          bash -n install.sh
          bash -n bin/tokenmaxxer

      - name: Verify npm package allow-list
        run: npm run verify:package

      - name: Release staging dry-run
        run: npm run release:dry-run

      - name: Release-set checksum verification
        run: npm run release:verify

      - name: Installer transactional fixture suite
        run: npx vitest run test/release/installer

      - name: Same-commit reproducible build
        run: npm run verify:reproducible-build

      - name: Git diff check
        run: git diff --check

      - name: Assert no tracked dist files
        run: git ls-files 'dist/**' | grep . && exit 1 || true
