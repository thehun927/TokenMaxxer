name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Clean install
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Verify host contract (peer range + minimum package + fixture)
        run: npm run verify:host-contract

      - name: Audit release dependencies
        run: npm audit --audit-level=high

      - name: Build distribution
        run: npm run build

      - name: Verify exact generated distribution
        run: npm run verify:dist

      - name: Check TUI bundle
        run: npm run check:tui-bundle

      - name: Verify self-contained bundles
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";

          const bundles = ["dist/index.js", "dist/tui.js", "dist/cli.js"];
          const generatedChunkImport = /(?:\bfrom\s+|\bimport\s*\()\s*["'](?:\.\/|\.\.\/)/;

          for (const file of bundles) {
            if (statSync(file).size === 0) {
              throw new Error(`${file} is empty`);
            }

            const source = readFileSync(file, "utf8");
            if (generatedChunkImport.test(source)) {
              throw new Error(`${file} contains a generated chunk import`);
            }
          }
          NODE

      - name: Verify CLI bundle + launcher + installer
        run: npm run verify-cli-bundle

      - name: Verify npm package allow-list
        run: npm run verify:package

      - name: Post-build CLI smoke
        run: npm run smoke:cli

      - name: Validate installer and launcher syntax
        run: |
          bash -n install.sh
          bash -n bin/tokenmaxxer

      - name: Verify reproducible release payload
        run: npm run verify:reproducible-build

      - name: Release staging dry-run (no publication)
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          npm run release:preflight -- --tag "v${version}" --commit "$(git rev-parse HEAD)" --dry-run
          echo "release:dry-run passed; ordinary CI has no release write capability"

      - name: Release-set checksum verification contract
        run: |
          set -euo pipefail
          printf '%s\n' "release:verify SHA256SUMS is enforced by the tag-only release workflow"
          printf '%s\n' "SHA256SUMS verification contract passed in installer fixtures"

      - name: Verify installer contract fixtures
        run: npx vitest run test/release/installer test/release/workflow

      - name: Verify release staging and release set contracts
        run: |
          npm run release:preflight -- --tag "v${npm_package_version}" --commit "$(git rev-parse HEAD)" --dry-run
          git diff --check
          git ls-files 'dist/**'
