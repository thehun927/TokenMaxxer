name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Prove immutable releases are enabled via Administration-read credential (fail closed)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?secrets.RELEASE_ADMIN_TOKEN (Administration: read) is required; contents:write does not grant Administration read}"
          settings="$(gh api "/repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '{enabled: .enabled, enforced_by_owner: .enforced_by_owner}')"
          printf '%s\n' "$settings"
          test "$(printf '%s' "$settings" | jq -r '.enabled // false')" = true

      - name: Release identity preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --require-main-ancestor

      - name: Clean install
        run: npm ci

      - name: Full release validation
        run: |
          set -euo pipefail
          npm test
          npx tsc --noEmit
          npm run verify:host-contract
          npm run audit:release
          npm run build
          npm run verify:dist
          npm run check:tui-bundle
          npm run verify-cli-bundle
          npm run smoke:cli
          bash -n install.sh
          bash -n bin/tokenmaxxer
          npm run verify:package
          npm run verify:reproducible-build
          npx vitest run test/release/installer test/release/workflow
          git diff --check
          test -z "$(git ls-files 'dist/**')"

      - name: Stage immutable release asset set
        run: |
          set -euo pipefail
          npm run release:stage -- --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --out .release
          npm run release:verify -- --dir .release --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TokenMaxxer $GITHUB_REF_NAME"

      - name: Upload complete staged asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" .release/RELEASE.json .release/SHA256SUMS .release/install.sh .release/tokenmaxxer .release/tokenmaxxer.js .release/tokenmaxxer-tui.js .release/tokenmaxxer-cli.js .release/tokenmaxxer.d.ts .release/tokenmaxxer-tui.d.ts .release/tokenmaxxer-cli.d.ts .release/tokenmaxxer-*.tgz

      - name: Verify uploaded asset inventory and staged checksums before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | map(.name) | sort | join("\n")')"
          tarball="$(printf '%s\n' .release/tokenmaxxer-*.tgz | xargs -n1 basename)"
          expected="$(printf '%s\n' RELEASE.json SHA256SUMS install.sh tokenmaxxer tokenmaxxer.js tokenmaxxer-tui.js tokenmaxxer-cli.js tokenmaxxer.d.ts tokenmaxxer-tui.d.ts tokenmaxxer-cli.d.ts "$tarball" | sort)"
          test "$actual" = "$expected"
          npm run release:verify -- --dir .release --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify published release (immutable attestation, immediately after publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify "$GITHUB_REF_NAME"
